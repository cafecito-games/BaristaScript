name: Bug report
description: Report a bug with the BaristaScript extension
body:

- type: markdown
  attributes:
    value: |
      - Write a descriptive issue title above.
      - Search [open](https://github.com/cafecito-games/BaristaScript/issues) and [closed](https://github.com/cafecito-games/BaristaScript/issues?q=is%3Aissue+is%3Aclosed) issues to ensure it has not already been reported.
- type: input
  attributes:
    label: Godot version
    description: >
      Paste the actual host engine's full `godot --version` output, including its build/revision.
    placeholder: Paste godot --version output
  validations:
    required: true

- type: textarea
  attributes:
    label: Extension build information
    description: |
      Follow [build diagnostics](https://github.com/cafecito-games/BaristaScript/blob/main/docs/build-identity.md) and paste the report from `python3 scripts/query_build_info.py --godot /path/to/godot --library /path/to/library`.
      This identifies the loaded library separately from your current checkout. If loading fails, include the error and the artifact-only inspection output described in the guide.
    render: text
  validations:
    required: true

- type: input
  attributes:
    label: System information
    description: |
      Specify the OS version.
    placeholder: Windows 10
  validations:
    required: true

- type: textarea
  attributes:
    label: Issue description
    description: |
      Describe your issue briefly. What doesn't work, and how do you expect it to work instead?
      You can include images or videos with drag and drop, and format code blocks or logs with <code>```</code> tags.
  validations:
    required: true
