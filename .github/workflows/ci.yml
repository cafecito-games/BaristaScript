# For syntax, see https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# This workflow is automatically triggered for every push and pull request, to verify that everything still builds.

name: Continuous Integration
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  static-checks:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout BaristaScript
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Setup Python for static checks
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Install pinned static check tools
        shell: bash
        run: python3 -m pip install -r scripts/requirements-format.txt -r tests/requirements.txt
      - name: Test static check failure modes
        shell: bash
        run: |
          python3 tests/test_check_format.py
          python3 tests/test_static_checks.py
      - name: Check maintained C++ formatting
        shell: bash
        run: python3 scripts/check_format.py
      - name: Check license headers
        shell: bash
        run: python3 scripts/add_license_header.py --check

  corpus-reproducibility:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout BaristaScript
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 0
      - name: Setup Python for offline audits
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Install offline audit dependency
        shell: bash
        run: python3 -m pip install -r tests/requirements.txt
      - name: Validate corpus source registration
        id: source
        shell: bash
        run: python3 scripts/check_corpus_reproducibility.py --github-output "$GITHUB_OUTPUT"
      - name: Checkout pinned public Foundry source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.revision }}
          path: .upstream-foundry
          submodules: false
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ steps.source.outputs.sparse_paths }}
      - name: Test reproducibility failure modes
        shell: bash
        run: |
          python3 tests/test_corpus_reproducibility.py --foundry .upstream-foundry
          python3 tests/test_import_analyzer_corpus.py --foundry .upstream-foundry
          python3 tests/test_import_runtime_corpus.py --foundry .upstream-foundry
          python3 tests/test_corpus_ratchet.py
      - name: Check all imported corpora
        shell: bash
        run: python3 scripts/check_corpus_reproducibility.py --foundry .upstream-foundry

      - name: Validate complete analyzer port inventory
        shell: bash
        run: |
          python3 tests/validate_analyzer_port_inventory.py --foundry-dir .upstream-foundry --require-m3-complete
          python3 tests/test_analyzer_port_inventory.py --foundry-dir .upstream-foundry

  build:
    strategy:
      fail-fast: false
      matrix:
        # Test a few selected combinations of parameters ("test case matrix").
        # While it would be nice to test all needed combinations, in practice this would a waste of CI usage time.
        # By building just with a few combinations, we only need a few runners,
        # while still achieving adequate coverage.
        # To make a full build with all combinations, use the make_build.yml workflow instead.
        include:
          - target: { platform: linux, arch: x86_64, os: ubuntu-22.04 }
            target-type: template_debug
            float-precision: single
          - target: { platform: windows, arch: x86_64, os: windows-latest }
            target-type: template_debug
            float-precision: single
          - target: { platform: windows, arch: x86_64, os: windows-latest }
            target-type: template_release
            float-precision: single
          - target: { platform: macos, arch: universal, os: macos-latest }
            target-type: template_debug
            float-precision: single
          - target: { platform: ios, arch: arm64, os: macos-latest }
            target-type: template_debug
            float-precision: single
          - target: { platform: android, arch: arm64, os: ubuntu-22.04 }
            target-type: template_debug
            float-precision: single
          - target: { platform: web, arch: wasm32, os: ubuntu-22.04 }
            target-type: template_release
            float-precision: single

    runs-on: ${{ matrix.target.os }}
    steps:
      # Clone this repository
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Python for offline audits
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Validate CI configuration
        shell: bash
        run: |
          python3 -m pip install -r tests/requirements.txt
          python3 tests/validate_ci.py
          python3 tests/test_native_transition_scope.py
          python3 tests/test_build_config.py
          python3 tests/test_build_consumers.py
          python3 tests/test_query_build_info.py
          python3 tests/test_run_gdscript_suites.py
          python3 tests/test_corpus_baseline.py
          python3 tests/test_corpus_expectations.py

      - name: Audit the platform seam
        shell: bash
        run: |
          python3 tests/audit_platform_seam.py
          python3 tests/test_audit_platform_seam.py

      - name: Check the warning table closure
        shell: bash
        run: python3 tests/test_warning_table_closure.py

      - name: Resolve shared build versions
        id: versions
        shell: bash
        run: python3 scripts/build_config.py --platform ${{ matrix.target.platform }} --format github >> "$GITHUB_OUTPUT"

      # Add linux x86_32 toolchain
      - name: Install multilib support
        if: ${{ matrix.target.platform == 'linux' && matrix.target.arch == 'x86_32' }}
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib

      # Setup dependencies
      # Use MSVC on Windows so CI does not depend on Chocolatey's mingw feed
      # (community.chocolatey.org has been returning 503 for mingw 12.2.0).
      - name: Setup godot-cpp
        uses: ./.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.target.platform }}
          em-version: ${{ steps.versions.outputs.emscripten }}
          windows-compiler: ${{ steps.versions.outputs.windows_compiler }}

      # Build GDExtension (with caches)

      - name: Restore .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-restore
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}

      - name: Build GDExtension Debug Build
        shell: sh
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
        run: |
          scons api_version=${{ steps.versions.outputs.godot_api }} target=${{ matrix.target-type }} platform=${{ matrix.target.platform }} arch=${{ matrix.target.arch }} precision=${{ matrix.float-precision }}

      - name: Verify distribution build identity
        shell: bash
        run: >-
          python3 scripts/verify_build_artifacts.py --binary-dir bin
          --platform ${{ matrix.target.platform }} --architecture ${{ matrix.target.arch }}
          --target ${{ matrix.target-type }} --api ${{ steps.versions.outputs.godot_api }}
          --precision ${{ matrix.float-precision }}

      - name: Verify parse-cache release surface
        shell: bash
        run: >-
          python3 tests/verify_parse_cache_surface.py
          --binary-dir project/bin/${{ matrix.target.platform }}
          --target-type ${{ matrix.target-type }}

      - name: Verify native tests are absent from distribution artifacts
        shell: bash
        run: >-
          python3 tests/verify_native_surface.py
          --binary-dir project/bin/${{ matrix.target.platform }}
          --target-type ${{ matrix.target-type }}

      - name: Probe the removed-warning-code compile error
        if: ${{ matrix.target.platform == 'linux' && matrix.target.arch == 'x86_64' && matrix.target-type == 'template_debug' }}
        shell: bash
        run: python3 tests/test_warning_code_removal.py

      # A GDScript parse error makes SceneTree quit 0, so no suite may be invoked directly here:
      # the runner discovers every project/tests/*_test.gd and fails the job unless the run
      # printed the guard sentinel that only executed code can produce. The Linux steps after
      # this one reuse the Godot binary it downloads, so each derives the same path again.
      - name: Verify editor recognition and GDScript suites
        if: ${{ matrix.target.platform == 'linux' && matrix.target.arch == 'x86_64' && matrix.target-type == 'template_debug' }}
        shell: bash
        env:
          GODOT_VERSION: ${{ steps.versions.outputs.godot_runtime }}
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          godot_binary="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          chmod +x "$godot_binary"

          "$godot_binary" --headless --path project --editor --quit
          grep -q 'example.barista::BaristaScript' project/.godot/editor/filesystem_cache*
          python3 tests/run_gdscript_suites.py --godot "$godot_binary"

      - name: Run the committed runtime fixture on stock Godot
        if: ${{ matrix.target.platform == 'linux' && matrix.target.arch == 'x86_64' && matrix.target-type == 'template_debug' }}
        shell: bash
        env:
          GODOT_VERSION: ${{ steps.versions.outputs.godot_runtime }}
        run: |
          godot_binary="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          python3 tests/test_runtime_scene.py --godot "$godot_binary"

      - name: Build and run the native suites with SCons
        if: ${{ matrix.target.platform == 'linux' && matrix.target.arch == 'x86_64' && matrix.target-type == 'template_debug' }}
        shell: bash
        env:
          GODOT_VERSION: ${{ steps.versions.outputs.godot_runtime }}
        run: |
          godot_binary="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          scons api_version=${{ steps.versions.outputs.godot_api }} target=template_debug barista_tests=yes
          python3 tests/test_run_native_suites.py --godot "$godot_binary"
          python3 tests/test_native_storage.py --godot "$godot_binary"
          python3 tests/run_native_suites.py --godot "$godot_binary"
          python3 tests/test_run_corpus_triage.py --godot "$godot_binary" \
            --library "$(python3 -c "import json; print(json.load(open('build/native-scons/native-artifact.json'))['library'])")"

      # The steps from here to the corpus triage re-prove that toggling native tests on and off
      # under SCons and CMake never leaves test code in an ordinary artifact. That is decided by
      # the build descriptions, not by the sources they compile: every matrix entry already
      # checks its freshly built ordinary artifact above. A pull request that changes none of
      # the build inputs listed, with the reasoning, in scripts/native_transition_scope.py
      # skips them. Every other event runs them, and so does any pull request whose changes
      # cannot be computed, because the steps run unless the decision is an explicit 'false'.
      - name: Decide whether to verify native build-system transitions
        id: transition_scope
        if: ${{ matrix.target.platform == 'linux' && matrix.target.arch == 'x86_64' && matrix.target-type == 'template_debug' }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/native_transition_scope.py
          --event "$EVENT_NAME"
          --pull-request-head "$PULL_REQUEST_HEAD"
          --github-output "$GITHUB_OUTPUT"

      - name: Verify the SCons native test off/on transition
        if: ${{ matrix.target.platform == 'linux' && matrix.target.arch == 'x86_64' && matrix.target-type == 'template_debug' && (github.event_name != 'pull_request' || steps.transition_scope.outputs.required != 'false') }}
        shell: bash
        env:
          GODOT_VERSION: ${{ steps.versions.outputs.godot_runtime }}
        run: |
          godot_binary="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          scons api_version=${{ steps.versions.outputs.godot_api }} target=template_debug barista_tests=no
          python3 tests/verify_native_surface.py --binary-dir project/bin/linux --target-type template_debug
          scons api_version=${{ steps.versions.outputs.godot_api }} target=template_release barista_tests=no
          python3 tests/verify_native_surface.py --binary-dir project/bin/linux --target-type template_release
          scons api_version=${{ steps.versions.outputs.godot_api }} target=template_debug barista_tests=yes
          python3 tests/run_native_suites.py --godot "$godot_binary"

      # Every CMake build in this step and the two after it, including the rebuild script's --jobs,
      # uses four jobs to match the public-repository ubuntu-22.04 runner (4 vCPU, 16 GB). GCC 11
      # peaks near 0.94 GB for the largest analyzer translation unit, so four concurrent compiles
      # stay near 3.5 GB. Keep an explicit count: with the Makefiles generator a bare --parallel is
      # an unbounded `make -j` that would start about a hundred compilers at once.
      - name: Build and run the native suites with CMake
        if: ${{ matrix.target.platform == 'linux' && matrix.target.arch == 'x86_64' && matrix.target-type == 'template_debug' && (github.event_name != 'pull_request' || steps.transition_scope.outputs.required != 'false') }}
        shell: bash
        env:
          GODOT_VERSION: ${{ steps.versions.outputs.godot_runtime }}
        run: |
          godot_binary="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          cmake -S . -B build/native-cmake -DCMAKE_BUILD_TYPE=Debug -DBARISTA_TESTS=ON
          cmake --build build/native-cmake --parallel 4
          python3 tests/test_run_native_suites.py --godot "$godot_binary" --build-dir build/native-cmake
          python3 tests/test_native_storage.py --godot "$godot_binary" --build-dir build/native-cmake
          python3 tests/run_native_suites.py --godot "$godot_binary" --build-dir build/native-cmake

      - name: Verify incremental native CMake rebuilds
        if: ${{ matrix.target.platform == 'linux' && matrix.target.arch == 'x86_64' && matrix.target-type == 'template_debug' && (github.event_name != 'pull_request' || steps.transition_scope.outputs.required != 'false') }}
        shell: bash
        env:
          GODOT_VERSION: ${{ steps.versions.outputs.godot_runtime }}
        run: |
          godot_binary="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          python3 tests/test_native_cmake_rebuild.py --godot "$godot_binary" --build-dir build/native-cmake --jobs 4

      - name: Verify the CMake native test off/on transition
        if: ${{ matrix.target.platform == 'linux' && matrix.target.arch == 'x86_64' && matrix.target-type == 'template_debug' && (github.event_name != 'pull_request' || steps.transition_scope.outputs.required != 'false') }}
        shell: bash
        env:
          GODOT_VERSION: ${{ steps.versions.outputs.godot_runtime }}
        run: |
          godot_binary="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          cmake -S . -B build/native-cmake -DBARISTA_TESTS=OFF
          cmake --build build/native-cmake --parallel 4
          python3 tests/verify_native_surface.py --binary-dir project/bin/linux --target-type template_debug
          cmake -S . -B build/native-cmake -DBARISTA_TESTS=ON
          cmake --build build/native-cmake --parallel 4
          python3 tests/run_native_suites.py --godot "$godot_binary" --build-dir build/native-cmake

      # Two committed guards already refuse a tampered residual-failure pin, but both compare the
      # pin against other committed bytes. This step is the only place that executes the cases the
      # pin describes, and it exits non-zero on an undeclared failure, an unowned failure, or a
      # pinned case that has started passing.
      - name: Triage the complete analyzer corpus against its residual-failure pin
        if: ${{ matrix.target.platform == 'linux' && matrix.target.arch == 'x86_64' && matrix.target-type == 'template_debug' }}
        shell: bash
        env:
          GODOT_VERSION: ${{ steps.versions.outputs.godot_runtime }}
        run: >-
          python3 scripts/run_corpus_triage.py
          --godot "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          --corpus res://tests/corpus/analyzer
          --report "$RUNNER_TEMP/analyzer-corpus-triage.json"
          --execution fast
          --shards 4
          --timeout 900

      # The runtime corpus is the same gate over a corpus that compiles and executes its cases,
      # so it adds two refusals the analyzer corpus cannot produce: a case that crashes or hangs
      # the host is a hard failure that may not be pinned, and a shard that dies mid-run is
      # refused rather than absorbed as a shorter population.
      - name: Triage the complete runtime corpus against its residual-failure pin
        if: ${{ matrix.target.platform == 'linux' && matrix.target.arch == 'x86_64' && matrix.target-type == 'template_debug' }}
        shell: bash
        env:
          GODOT_VERSION: ${{ steps.versions.outputs.godot_runtime }}
        run: >-
          python3 scripts/run_corpus_triage.py
          --godot "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          --corpus res://tests/corpus/runtime
          --report "$RUNNER_TEMP/runtime-corpus-triage.json"
          --execution fast
          --shards 4
          --timeout 900

      # Focused desktop debug import + SuiteGuard runners for #21 platform evidence. Linux keeps the
      # heavier cmake on/off matrix above; Windows/macOS debug get import + gdscript + native suites
      # without a second harness or SuiteGuard bypass. iOS remains compile-only via the matrix build.
      - name: Verify editor recognition (Windows/macOS debug)
        if: ${{ (matrix.target.platform == 'windows' || matrix.target.platform == 'macos') && matrix.target-type == 'template_debug' }}
        shell: bash
        env:
          GODOT_VERSION: ${{ steps.versions.outputs.godot_runtime }}
          MATRIX_PLATFORM: ${{ matrix.target.platform }}
        run: |
          set -euo pipefail
          if [[ "$MATRIX_PLATFORM" == "windows" ]]; then
            curl --fail --location --retry 3 \
              --output "$RUNNER_TEMP/godot.zip" \
              "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_win64.exe.zip"
            unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
            godot_binary="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_win64.exe"
          else
            curl --fail --location --retry 3 \
              --output "$RUNNER_TEMP/godot.zip" \
              "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
            unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
            godot_binary="$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot"
            chmod +x "$godot_binary"
          fi

          "$godot_binary" --headless --path project --editor --quit
          grep -q 'example.barista::BaristaScript' project/.godot/editor/filesystem_cache*
          python3 tests/run_gdscript_suites.py --godot "$godot_binary"

          # G1: pin an explicit disabled LongPathsEnabled profile before native cache
          # long-path/UNC controls. Ambient registry reporting alone is not evidence.
          if [[ "$MATRIX_PLATFORM" == "windows" ]]; then
            powershell.exe -NoProfile -Command \
              "Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Type DWord -Value 0 -Force; \
               \$v = (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled).LongPathsEnabled; \
               if (\$v -ne 0) { throw \"LongPathsEnabled=\$v (want 0)\" }"
          fi

          scons api_version=${{ steps.versions.outputs.godot_api }} target=template_debug platform=${{ matrix.target.platform }} arch=${{ matrix.target.arch }} precision=${{ matrix.float-precision }} barista_tests=yes
          python3 tests/run_native_suites.py --godot "$godot_binary"

          # G1: arm64 launch of the universal artifact is useful but does not satisfy the
          # required macOS x86_64 runtime. Re-run import + suites under Rosetta x86_64.
          if [[ "$MATRIX_PLATFORM" == "macos" ]]; then
            arch -x86_64 uname -m | grep -qx 'x86_64'
            arch -x86_64 "$godot_binary" --headless --path project --editor --quit
            arch -x86_64 python3 tests/run_gdscript_suites.py --godot "$godot_binary"
            arch -x86_64 python3 tests/run_native_suites.py --godot "$godot_binary"
          fi

      - name: Save .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-save
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}
