name: API Reference
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_call:

permissions:
  contents: read

jobs:
  api-reference:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install pinned documentation tooling
        run: python3 -m pip install -r docs/requirements.txt
      - name: Cache verified Godot documentation archive
        uses: actions/cache@v4
        with:
          path: build/reference-tools/godot.tar.gz
          key: reference-tools-${{ hashFiles('docs/reference-toolchain.json') }}
      - name: Validate XML, pages, and links
        run: python3 scripts/build_reference.py --check
      - name: Exercise invalid fixtures and reproducible output
        run: python3 tests/test_build_reference.py
      - name: Build static reference
        run: python3 scripts/build_reference.py --output build/docs
      - name: Upload inspectable reference
        uses: actions/upload-artifact@v4
        with:
          name: baristascript-api-reference
          path: build/docs/
          if-no-files-found: error
