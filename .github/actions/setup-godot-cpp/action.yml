name: Setup godot-cpp
description: Setup build dependencies for godot-cpp.

inputs:
  platform:
    required: true
    description: Target platform.
  em-version:
    default: ""
    description: Emscripten version.
  windows-compiler:
    required: true
    description: The compiler toolchain to use on Windows ('mingw' or 'msvc').
    default: ""
  mingw-version:
    default: ""
    description: MinGW version.
  ndk-version:
    default: ""
    description: Android NDK version.
  buildtool:
    default: scons
    description: scons or cmake.
  scons-version:
    default: ""
    description: SCons version.

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.x

    - name: Resolve configured tool versions
      id: versions
      shell: bash
      run: >-
        python3 scripts/build_config.py --setup --platform "${{ inputs.platform }}" --format github
        --tool "emscripten=${{ inputs.em-version }}" --tool "mingw=${{ inputs.mingw-version }}"
        --tool "ndk=${{ inputs.ndk-version }}" --tool "scons=${{ inputs.scons-version }}"
        --tool "windows_compiler=${{ inputs.windows-compiler }}" >> "$GITHUB_OUTPUT"

    - name: Setup Android dependencies
      if: inputs.platform == 'android'
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: ${{ steps.versions.outputs.ndk }}
        link-to-sdk: true

    - name: Setup Web dependencies
      if: inputs.platform == 'web'
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: ${{ steps.versions.outputs.emscripten }}
        no-cache: true

    # Chocolatey's community feed occasionally returns 503 while installing the
    # pinned mingw package. Retry a few times before failing the job — the
    # egor-tensin/setup-mingw action itself has no retry loop.
    - name: Setup MinGW (attempt 1)
      id: setup-mingw-1
      if: inputs.platform == 'windows' && steps.versions.outputs.windows_compiler == 'mingw'
      continue-on-error: true
      uses: egor-tensin/setup-mingw@v2
      with:
        version: ${{ steps.versions.outputs.mingw }}

    - name: Wait before MinGW retry
      if: inputs.platform == 'windows' && steps.versions.outputs.windows_compiler == 'mingw' && steps.setup-mingw-1.outcome == 'failure'
      shell: pwsh
      run: Start-Sleep -Seconds 20

    - name: Setup MinGW (attempt 2)
      id: setup-mingw-2
      if: inputs.platform == 'windows' && steps.versions.outputs.windows_compiler == 'mingw' && steps.setup-mingw-1.outcome == 'failure'
      continue-on-error: true
      uses: egor-tensin/setup-mingw@v2
      with:
        version: ${{ steps.versions.outputs.mingw }}

    - name: Wait before MinGW final retry
      if: inputs.platform == 'windows' && steps.versions.outputs.windows_compiler == 'mingw' && steps.setup-mingw-1.outcome == 'failure' && steps.setup-mingw-2.outcome == 'failure'
      shell: pwsh
      run: Start-Sleep -Seconds 40

    - name: Setup MinGW (attempt 3)
      id: setup-mingw-3
      if: inputs.platform == 'windows' && steps.versions.outputs.windows_compiler == 'mingw' && steps.setup-mingw-1.outcome == 'failure' && steps.setup-mingw-2.outcome == 'failure'
      uses: egor-tensin/setup-mingw@v2
      with:
        version: ${{ steps.versions.outputs.mingw }}

    - name: Confirm MinGW setup
      if: inputs.platform == 'windows' && steps.versions.outputs.windows_compiler == 'mingw'
      shell: pwsh
      run: |
        $ok = ($env:SETUP_MINGW_1 -eq 'success') -or ($env:SETUP_MINGW_2 -eq 'success') -or ($env:SETUP_MINGW_3 -eq 'success')
        if (-not $ok) {
          throw "MinGW setup failed after 3 attempts (Chocolatey/community feed)."
        }
        Write-Host "MinGW setup succeeded."
      env:
        SETUP_MINGW_1: ${{ steps.setup-mingw-1.outcome }}
        SETUP_MINGW_2: ${{ steps.setup-mingw-2.outcome }}
        SETUP_MINGW_3: ${{ steps.setup-mingw-3.outcome }}

    - name: Setup SCons
      if: inputs.buildtool == 'scons'
      shell: bash
      run: |
        python3 -c "import sys; print(sys.version)"
        python3 -m pip install scons==${{ steps.versions.outputs.scons }}
        scons --version

    - name: Install Ninja
      if: inputs.buildtool == 'cmake'
      uses: ashutoshvarma/setup-ninja@master
